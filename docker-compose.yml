version: "3.9"

x-backend-env: &backend-env
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-paynexus}:${POSTGRES_PASSWORD:-paynexus_secret_change_me}@postgres:5432/${POSTGRES_DB:-paynexus}
  SYNC_DATABASE_URL: postgresql://${POSTGRES_USER:-paynexus}:${POSTGRES_PASSWORD:-paynexus_secret_change_me}@postgres:5432/${POSTGRES_DB:-paynexus}
  REDIS_URL: redis://redis:6379/0
  JWT_SECRET_KEY: ${JWT_SECRET_KEY:-super_secret_jwt_key_change_in_production_min_32_chars}
  JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
  JWT_ACCESS_TOKEN_EXPIRE_MINUTES: ${JWT_ACCESS_TOKEN_EXPIRE_MINUTES:-60}
  JWT_REFRESH_TOKEN_EXPIRE_DAYS: ${JWT_REFRESH_TOKEN_EXPIRE_DAYS:-7}
  FIELD_ENCRYPTION_KEY: ${FIELD_ENCRYPTION_KEY}
  IDEMPOTENCY_TTL_SECONDS: ${IDEMPOTENCY_TTL_SECONDS:-86400}
  IDEMPOTENCY_LOCK_TIMEOUT_SECONDS: ${IDEMPOTENCY_LOCK_TIMEOUT_SECONDS:-30}
  RAIL_UPI_URL: http://rail-upi-sim:8101
  RAIL_NEFT_URL: http://rail-neft-sim:8102
  RAIL_SWIFT_URL: http://rail-swift-sim:8103
  RAIL_CARD_URL: http://rail-card-sim:8104
  SANCTIONS_URL: http://sanctions-provider-sim:8201
  KYC_URL: http://kyc-provider-sim:8202
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  APP_ENV: ${APP_ENV:-development}
  APP_SECRET: ${APP_SECRET:-app_secret_for_webhook_hmac_change_me}
  RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-300}
  ALLOWED_ORIGINS: "http://localhost:3000,http://localhost"
  SEED_RANDOM_SEED: "42"
  SEED_NUM_CUSTOMERS: "200"
  SEED_NUM_PAYMENTS: "5000"

services:
  # ── Infrastructure ──────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-paynexus}
      POSTGRES_USER: ${POSTGRES_USER:-paynexus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-paynexus_secret_change_me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-paynexus} -d ${POSTGRES_DB:-paynexus}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── Database Migrator + Seeder (runs once, exits) ───────────────────────────
  migrator:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: sh /app/entrypoint-migrate.sh
    environment:
      <<: *backend-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - model_data:/app/models

  # ── Backend API ─────────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: sh /app/entrypoint-api.sh
    environment:
      <<: *backend-env
    ports:
      - "8000:8000"
    depends_on:
      migrator:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rail-upi-sim:
        condition: service_healthy
      rail-neft-sim:
        condition: service_healthy
      rail-swift-sim:
        condition: service_healthy
      rail-card-sim:
        condition: service_healthy
      sanctions-provider-sim:
        condition: service_healthy
      kyc-provider-sim:
        condition: service_healthy
    volumes:
      - model_data:/app/models
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  # ── Orchestrator Worker ──────────────────────────────────────────────────────
  orchestrator:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: python -m app.workers.orchestrator
    environment:
      <<: *backend-env
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - model_data:/app/models
    restart: unless-stopped

  # ── Reconciliation Worker ───────────────────────────────────────────────────
  reconciliation-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: python -m app.workers.reconciliation_worker
    environment:
      <<: *backend-env
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  # ── Outbox Publisher ─────────────────────────────────────────────────────────
  outbox-publisher:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: python -m app.workers.outbox_publisher
    environment:
      <<: *backend-env
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  # ── Mock Rail Services ───────────────────────────────────────────────────────
  rail-upi-sim:
    build:
      context: ./mock-services/rail-upi
      dockerfile: Dockerfile
    ports:
      - "8101:8101"
    environment:
      SERVICE_PORT: "8101"
      DEFAULT_LATENCY_MS: "150"
      DEFAULT_ERROR_RATE: "0.0"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8101/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  rail-neft-sim:
    build:
      context: ./mock-services/rail-neft
      dockerfile: Dockerfile
    ports:
      - "8102:8102"
    environment:
      SERVICE_PORT: "8102"
      DEFAULT_LATENCY_MS: "500"
      DEFAULT_ERROR_RATE: "0.0"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8102/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  rail-swift-sim:
    build:
      context: ./mock-services/rail-swift
      dockerfile: Dockerfile
    ports:
      - "8103:8103"
    environment:
      SERVICE_PORT: "8103"
      DEFAULT_LATENCY_MS: "2000"
      DEFAULT_ERROR_RATE: "0.0"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8103/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  rail-card-sim:
    build:
      context: ./mock-services/rail-card
      dockerfile: Dockerfile
    ports:
      - "8104:8104"
    environment:
      SERVICE_PORT: "8104"
      DEFAULT_LATENCY_MS: "300"
      DEFAULT_ERROR_RATE: "0.0"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8104/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  sanctions-provider-sim:
    build:
      context: ./mock-services/sanctions
      dockerfile: Dockerfile
    ports:
      - "8201:8201"
    environment:
      SERVICE_PORT: "8201"
      DEFAULT_LATENCY_MS: "200"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8201/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  kyc-provider-sim:
    build:
      context: ./mock-services/kyc
      dockerfile: Dockerfile
    ports:
      - "8202:8202"
    environment:
      SERVICE_PORT: "8202"
      DEFAULT_LATENCY_MS: "300"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8202/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # ── Frontend ─────────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:8000
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:80/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6

  # ── Observability ─────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.51.0
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"

  grafana:
    image: grafana/grafana:10.4.0
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:-admin_change_me}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards

volumes:
  postgres_data:
  redis_data:
  grafana_data:
  prometheus_data:
  model_data:
